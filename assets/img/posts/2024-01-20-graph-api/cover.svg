      .title { font: 700 54px Georgia, "Times New Roman", serif; fill: #101010; }
      .sub { font: 400 26px Georgia, "Times New Roman", serif; fill: #222; opacity: 0.78; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>
  <path class="soft" d="M0 130 H340 M0 240 H290 M0 350 H260 M860 130 H1200 M920 250 H1200 M860 370 H1200"/>

  <g transform="translate(170 128)">
