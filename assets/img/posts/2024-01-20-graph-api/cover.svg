    <circle cx="190" cy="74" r="8" fill="#111"/>
    <circle cx="290" cy="132" r="8" fill="#111"/>
    <circle cx="290" cy="248" r="8" fill="#111"/>
    <circle cx="190" cy="306" r="8" fill="#111"/>
    <circle cx="90" cy="248" r="8" fill="#111"/>
    <circle cx="90" cy="132" r="8" fill="#111"/>
    <path class="ink" d="M190 74 L290 132 L290 248 L190 306 L90 248 L90 132 Z"/>
    <path class="ink" d="M90 132 L190 190 L290 132 M290 248 L190 190 L90 248"/>
    <circle cx="190" cy="190" r="10" fill="#111"/>

