<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Software Testing Technologies cover</title>
  <desc id="d">DevOps pipeline and quality check on dark background with emerald accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #10b981; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Pipeline / config panel -->
  <g transform="translate(100 140)">
    <rect class="line" x="0" y="0" width="280" height="180" rx="20"/>
    <path class="line" d="M36 54h208M36 90h208M36 126h208"/>
    <circle class="accent" cx="244" cy="54" r="6"/>
    <circle class="accent" cx="220" cy="90" r="6"/>
    <circle class="accent" cx="196" cy="126" r="8">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Cloud / deploy -->
  <g transform="translate(420 100)">
    <path class="line" d="M160 320C64 320 12 268 12 208C12 148 58 104 112 102C136 62 176 36 222 36C276 36 320 72 338 120C402 124 460 172 460 236C460 300 402 348 338 348H160Z"/>
    <rect class="line" x="172" y="164" width="132" height="36" rx="8"/>
    <rect class="line" x="172" y="212" width="132" height="36" rx="8"/>
    <rect class="line" x="172" y="260" width="132" height="36" rx="8"/>
    <circle class="accent" cx="280" cy="182" r="5"/>
    <circle class="accent" cx="280" cy="230" r="5"/>
    <circle class="accent" cx="280" cy="278" r="5"/>
  </g>
  <!-- Check / success -->
  <g transform="translate(880 140)">
    <circle class="line" cx="120" cy="120" r="100"/>
    <path class="accent" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"
      d="M70 120 L105 158 L180 82" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" values="220;0" dur="0.01" fill="freeze"/>
    </path>
  </g>
  <!-- Flow lines -->
  <path class="dim" d="M380 220 H420 M800 220 H820" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
