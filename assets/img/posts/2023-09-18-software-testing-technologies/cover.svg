<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Software Testing Technologies cover</title>
  <desc id="d">Test runner rack, pipeline flow, and cloud with check — testing and DevOps with green accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #10b981; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left: test runner / server rack -->
  <g transform="translate(100 100)">
    <rect class="line" x="0" y="0" width="280" height="400" rx="12"/>
    <rect class="line" x="24" y="24" width="232" height="72" rx="6"/>
    <path class="line" d="M48 52h80M48 72h120M48 92h60"/>
    <circle class="accent" cx="236" cy="60" r="5"/>
    <rect class="line" x="24" y="108" width="232" height="72" rx="6"/>
    <path class="line" d="M48 136h80M48 156h120M48 176h60"/>
    <circle class="accent" cx="236" cy="144" r="5"/>
    <rect class="line" x="24" y="192" width="232" height="72" rx="6"/>
    <path class="line" d="M48 220h80M48 248h120M48 260h60"/>
    <circle class="accent" cx="236" cy="228" r="5"/>
    <rect class="line" x="24" y="276" width="232" height="72" rx="6"/>
    <path class="line" d="M48 304h80M48 324h120M48 344h60"/>
    <circle class="accent" cx="236" cy="312" r="6">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center: two pipeline boxes -->
  <g transform="translate(420 240)">
    <path class="dim" d="M0 60H240" stroke-dasharray="8 14" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-80;0" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <rect class="line" x="80" y="40" width="40" height="40" rx="6"/>
    <rect class="line" x="200" y="40" width="40" height="40" rx="6"/>
    <path class="line" d="M100 50h20M100 60h20M100 70h20" stroke-width="1.5"/>
    <path class="line" d="M220 50h20M220 60h20M220 70h20" stroke-width="1.5"/>
  </g>

  <!-- Right: cloud with check (tests passed / deploy) -->
  <g transform="translate(660 120)">
    <path class="line" d="M220 120 Q280 80 340 120 Q400 100 420 160 Q480 180 460 240 Q500 280 420 280 H120 Q60 280 80 220 Q60 160 140 160 Q160 100 220 120Z"/>
    <path class="accent" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"
      d="M200 200l45 50 95-90">
    </path>
  </g>
</svg>
