<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">AI cover</title>
  <desc id="d">Neural network, pipeline flow, and processing core — IT and AI themes with blue accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #3b82f6; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left: neural network / AI nodes -->
  <g transform="translate(100 100)">
    <rect class="line" x="0" y="0" width="280" height="400" rx="12"/>
    <rect class="line" x="40" y="40" width="200" height="200" rx="12"/>
    <path class="line" d="M80 100h120M80 160h120M80 220h120M100 80v120M160 80v120M220 80v120"/>
    <circle class="accent" cx="160" cy="160" r="10">
      <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle class="accent" cx="40" cy="160" r="5" opacity="0.8"/>
    <circle class="accent" cx="280" cy="160" r="5" opacity="0.8"/>
    <circle class="accent" cx="160" cy="40" r="5" opacity="0.8"/>
    <circle class="accent" cx="160" cy="360" r="5" opacity="0.8"/>
  </g>

  <!-- Center: two pipeline boxes -->
  <g transform="translate(420 240)">
    <path class="dim" d="M0 60H240" stroke-dasharray="8 14" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-80;0" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <rect class="line" x="80" y="40" width="40" height="40" rx="6"/>
    <rect class="line" x="200" y="40" width="40" height="40" rx="6"/>
    <path class="line" d="M100 50h20M100 60h20M100 70h20" stroke-width="1.5"/>
    <path class="line" d="M220 50h20M220 60h20M220 70h20" stroke-width="1.5"/>
  </g>

  <!-- Right: processing core (AI / compute) -->
  <g transform="translate(660 120)">
    <circle class="line" cx="140" cy="140" r="120"/>
    <path class="line" d="M140 20v240M20 140h240M55 55l170 170M225 55L55 225"/>
    <circle class="accent" cx="140" cy="140" r="14">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
