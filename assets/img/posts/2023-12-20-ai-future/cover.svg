<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">AI cover</title>
  <desc id="d">Neural network and AI circuit on dark background with soft blue accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #3b82f6; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.6; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left: neural grid -->
  <g transform="translate(140 100)">
    <rect class="line" x="0" y="0" width="380" height="380" rx="24"/>
    <rect class="line" x="60" y="60" width="260" height="260" rx="16"/>
    <path class="line" d="M100 120h200M100 190h200M100 260h200M120 100v200M190 100v200M260 100v200"/>
    <circle class="accent" cx="190" cy="190" r="12" filter="url(#glow-f)">
      <animate attributeName="r" values="10;14;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle class="accent" cx="60" cy="190" r="5" opacity="0.8"/>
    <circle class="accent" cx="320" cy="190" r="5" opacity="0.8"/>
    <circle class="accent" cx="190" cy="60" r="5" opacity="0.8"/>
    <circle class="accent" cx="190" cy="320" r="5" opacity="0.8"/>
  </g>
  <!-- Right: processing core -->
  <g transform="translate(680 160)">
    <circle class="line" cx="140" cy="140" r="120"/>
    <path class="line" d="M140 20v240M20 140h240M55 55l170 170M225 55L55 225"/>
    <circle class="accent" cx="140" cy="140" r="14" filter="url(#glow-f)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Soft connecting arc -->
  <path class="dim" d="M520 315 Q600 200 680 220" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
