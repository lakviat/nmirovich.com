<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Coding Best Practices cover</title>
  <desc id="d">Code panel and quality check on dark background with teal accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #06b6d4; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Code / practices panel -->
  <g transform="translate(100 140)">
    <rect class="line" x="0" y="0" width="520" height="320" rx="24"/>
    <path class="line" d="M48 78h422M48 130h382M48 182h342M48 234h302"/>
    <circle class="accent" cx="470" cy="78" r="6"/>
    <circle class="accent" cx="430" cy="130" r="6"/>
    <circle class="accent" cx="390" cy="182" r="6"/>
    <circle class="accent" cx="350" cy="234" r="8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Quality check -->
  <g transform="translate(740 160)">
    <circle class="line" cx="170" cy="140" r="128"/>
    <path class="accent" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"
      d="M95 140l55 55 120-109" stroke-dasharray="280" stroke-dashoffset="280">
      <animate attributeName="stroke-dashoffset" values="280;0" dur="0.01" fill="freeze"/>
    </path>
  </g>
  <!-- Soft flow line -->
  <path class="dim" d="M620 300 H700" stroke-dasharray="8 12">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
