<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Invest In Yourself cover</title>
  <desc id="d">Learning stack, pipeline flow, and achievement badge — growth and IT skills with amber accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#25262b"/>
    </linearGradient>
    <style>
      .line { stroke: #a1a1aa; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #f59e0b; }
      .dim { stroke: #71717a; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left: learning / skills stack (courses, certs) -->
  <g transform="translate(100 100)">
    <rect class="line" x="0" y="0" width="280" height="400" rx="12"/>
    <rect class="line" x="24" y="24" width="232" height="72" rx="8"/>
    <path class="line" d="M48 52h100M48 72h160M48 92h80"/>
    <circle class="accent" cx="236" cy="60" r="5"/>
    <rect class="line" x="24" y="108" width="232" height="72" rx="8"/>
    <path class="line" d="M48 136h100M48 156h160M48 176h80"/>
    <circle class="accent" cx="236" cy="144" r="5"/>
    <rect class="line" x="24" y="192" width="232" height="72" rx="8"/>
    <path class="line" d="M48 220h100M48 248h160M48 260h80"/>
    <circle class="accent" cx="236" cy="228" r="5"/>
    <rect class="line" x="24" y="276" width="232" height="72" rx="8"/>
    <path class="line" d="M48 304h100M48 324h160M48 344h80"/>
    <circle class="accent" cx="236" cy="312" r="6">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Center: two pipeline boxes -->
  <g transform="translate(420 240)">
    <path class="dim" d="M0 60H240" stroke-dasharray="8 14" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="0;-80;0" keyTimes="0;0.3;1" dur="4s" repeatCount="indefinite"/>
    </path>
    <rect class="line" x="80" y="40" width="40" height="40" rx="6"/>
    <rect class="line" x="200" y="40" width="40" height="40" rx="6"/>
    <path class="line" d="M100 50h20M100 60h20M100 70h20" stroke-width="1.5"/>
    <path class="line" d="M220 50h20M220 60h20M220 70h20" stroke-width="1.5"/>
  </g>

  <!-- Right: achievement badge (growth, level up) -->
  <g transform="translate(660 100)">
    <rect class="line" x="40" y="20" width="260" height="320" rx="20"/>
    <path class="line" d="M120 180h120M170 120v120"/>
    <circle class="accent" cx="170" cy="160" r="20">
      <animate attributeName="r" values="16;22;16" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
